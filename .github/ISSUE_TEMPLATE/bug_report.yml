name: Bug report
description: Something in Materia v2 is broken. Feature requests and planned work live in Linear.
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        **Never paste real client data** (names, matters, documents, emails) into an issue. Use fictional examples.
        Security problems go through private vulnerability reporting instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you saw, and what you expected to see.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click …
        3. See …
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: local / dev / staging / prod, plus browser and OS.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Request ids and error codes help. Redact any personal information.
