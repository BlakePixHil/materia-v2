name: Terraform
description: Installs Terraform (checksum-verified), authenticates as terraform-agent through Workload Identity Federation and runs `terraform init` for one environment (FND-05).

inputs:
  env:
    description: Environment (dev or prod); selects envs/<env>.backend.hcl.
    required: true
  workload-identity-provider:
    description: The TF_WIF_PROVIDER variable (bootstrap output terraform_wif_provider).
    required: true
  service-account:
    description: The TF_SERVICE_ACCOUNT variable (bootstrap output terraform_service_account).
    required: true

runs:
  using: composite
  steps:
    - name: Check the Terraform variables
      shell: bash
      env:
        WIF_PROVIDER: ${{ inputs.workload-identity-provider }}
        SERVICE_ACCOUNT: ${{ inputs.service-account }}
      run: |
        if [ -z "$WIF_PROVIDER" ] || [ -z "$SERVICE_ACCOUNT" ]; then
          echo "::error::Set the TF_WIF_PROVIDER and TF_SERVICE_ACCOUNT variables from the bootstrap outputs (docs/runbooks/deploy.md, one-time setup)."
          exit 1
        fi

    - name: Install Terraform (checksum-verified)
      shell: bash
      env:
        TERRAFORM_VERSION: 1.16.5
      run: |
        cd "$RUNNER_TEMP"
        base="https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}"
        curl -fsSLO "$base/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
        curl -fsSLO "$base/terraform_${TERRAFORM_VERSION}_SHA256SUMS"
        sha256sum -c --ignore-missing "terraform_${TERRAFORM_VERSION}_SHA256SUMS"
        unzip -q "terraform_${TERRAFORM_VERSION}_linux_amd64.zip" -d "$RUNNER_TEMP/bin"
        echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

    - name: Authenticate to Google Cloud (Workload Identity Federation, no key)
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        workload_identity_provider: ${{ inputs.workload-identity-provider }}
        service_account: ${{ inputs.service-account }}

    - name: terraform init
      shell: bash
      run: terraform -chdir=infra/terraform init -input=false -reconfigure -backend-config="envs/${{ inputs.env }}.backend.hcl"
