# The restore drill (SEC-03, docs/runbooks/restore.md): restores the newest Firestore managed
# backup and the newest nightly export of materia-v2-dev into scratch databases, checks every
# collection group's count against the live database at the same snapshot time, records the RPO
# and restore time in the run summary, and deletes the scratch databases. Quarterly, on the 1st of
# January, April, July and October (22:00 UTC: 08:00 or 09:00 in Melbourne, outside quiet hours),
# or by hand. A failed run (mismatched counts, nothing to restore) emails the repository's watchers
# like any failed workflow. Source `status` only lists what the backups have done lately
# (`materia-scripts backup-status`); `all` lists it before drilling; `run-export` lists it and then
# starts the nightly export now. `restore-matter` dry-runs the single-matter restore of one matter
# (the `matter` input, `<orgId>/<matterId>`, or the first matter found) from PITR an hour ago: it
# reads and compares, and writes nothing.
#
# Runs `materia-scripts backup-drill` from main as terraform-agent, through the same Workload
# Identity pool as infra.yml (GitHub environment infra-dev). Dev only: the script refuses prod.
name: backup-drill
run-name: backup-drill ${{ inputs.source || 'all' }}

on:
  schedule:
    - cron: '0 22 1 1,4,7,10 *'
  workflow_dispatch:
    inputs:
      source:
        description: What to restore
        required: true
        type: choice
        options: [all, backup, export, pitr, status, run-export, restore-matter]
        default: all
      matter:
        description: 'restore-matter only: <orgId>/<matterId> (blank: the first matter found)'
        required: false
        type: string
        default: ''

concurrency:
  group: backup-drill
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  drill:
    name: drill (${{ inputs.source || 'all' }})
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: infra-dev
    permissions:
      contents: read
      id-token: write # Workload Identity Federation
    env:
      PROJECT: ${{ vars.GCP_PROJECT_DEV }}
      SOURCE: ${{ inputs.source || 'all' }}
    steps:
      - name: Check the inputs
        run: |
          if [ -z "$PROJECT" ]; then
            echo "::error::GCP_PROJECT_DEV is not set."
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Authenticate to Google Cloud as terraform-agent (Workload Identity Federation, no key)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.TF_WIF_PROVIDER }}
          service_account: ${{ vars.TF_SERVICE_ACCOUNT }}

      # Read-only: what the backups, exports and files copy have done lately (evidence, diagnosis).
      - name: Backup status
        if: env.SOURCE == 'status' || env.SOURCE == 'all' || env.SOURCE == 'run-export'
        run: pnpm -s materia-scripts backup-status --project "$PROJECT" ${{ env.SOURCE == 'run-export' && '--run-export' || '' }}

      - name: Restore drill (${{ env.SOURCE }})
        if: env.SOURCE != 'status' && env.SOURCE != 'run-export' && env.SOURCE != 'restore-matter'
        run: pnpm -s materia-scripts backup-drill --project "$PROJECT" --source "$SOURCE"

      # Dry run only (no --apply): reads the matter as of an hour ago and the live one, prints the diff.
      - name: Single-matter restore (dry run)
        if: env.SOURCE == 'restore-matter'
        env:
          MATTER: ${{ inputs.matter }}
        run: |
          if [ -z "$MATTER" ]; then
            token=$(gcloud auth print-access-token)
            MATTER=$(curl -fsS -X POST -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
              "https://firestore.googleapis.com/v1/projects/$PROJECT/databases/(default)/documents:runQuery" \
              -d '{"structuredQuery":{"from":[{"collectionId":"matters","allDescendants":true}],"select":{"fields":[{"fieldPath":"__name__"}]},"limit":1}}' \
              | jq -r '.[0].document.name // empty' | sed -E 's#.*/documents/orgs/([^/]+)/matters/([^/]+)$#\1/\2#')
          fi
          if ! [[ "$MATTER" =~ ^[A-Za-z0-9_-]+/[A-Za-z0-9_-]+$ ]]; then
            echo "::error::No matter to restore (give the matter input as <orgId>/<matterId>)."
            exit 1
          fi
          read_time=$(date -u -d '-60 min' +%Y-%m-%dT%H:%M:00Z)
          pnpm -s materia-scripts restore-matter --project "$PROJECT" --org "${MATTER%%/*}" --matter "${MATTER##*/}" --read-time "$read_time"
