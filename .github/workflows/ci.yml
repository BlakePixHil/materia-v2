# CI (FND-04). Every job runs `nx affected`, so unchanged projects are skipped.
# `ci-ok` is the only required check on main: it passes when every job succeeded or was skipped.
#
# Actions minutes are billed, so the `gate` job picks how much of CI a run needs (mode):
#   full  PRs, the morning run and manual dispatches: every job. PRs skip CodeQL and run e2e in
#         Chromium only; the morning run adds both (WebKit = iPhone Safari).
#   main  pushes to main and catch-up runs: the fast checks only. e2e, Storybook, the container
#         tests, Terraform and security already ran on the PR; the morning run repeats them daily.
#   docs  docs-only changes: lint (Prettier) only.
#   skip  pushes to main in quiet hours (22:00-07:30 Melbourne, nobody is testing), and morning
#         runs with nothing new to deploy. deploy-dev only deploys runs whose `build` job ran,
#         so quiet-hour merges wait for the morning run, which tests everything merged since the
#         last dev deploy and deploys it. Release commits (the release-please PR) are never held
#         back. To deploy overnight anyway, dispatch this workflow (or deploy-dev) on main.
#
# The morning run: GitHub fires this repo's crons hours late (06:30 crons arrived around noon),
# so a Claude routine ("Morning dev deploy") dispatches this workflow with `morning: true` at 06:31
# and 07:31 Melbourne (the second catches merges made after the first). The crons stay as a late
# safety net. A morning run, dispatched or cron, deploys only when dev isn't on main yet.
#
# Two-hour batching: every dev deploy rebuilds every function (most of the Google Cloud bill), so
# deploy-dev skips a daytime push when dev deployed less than two hours ago
# (.github/scripts/last-dev-deploy.sh). The routine "Dev deploy catch-up" dispatches this workflow
# with `catchup: true` hourly from 08:00 to 21:00 Melbourne; once the two hours are up, that run
# (fast checks only) deploys whatever is still waiting.
# Reproduce any job locally with the commands in AGENTS.md → "CI jobs locally".
#
# Third-party code: only GitHub-owned actions are used (actions/*, github/codeql-action). CLI tools
# are pinned versions, verified against their published checksums.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  # Safety net for the morning run (see the top). Cron is UTC: 19:30/20:30 are 06:30 in daylight
  # saving / standard time, 20:40/21:40 are 07:40. The gate skips these during quiet hours before
  # 06:00 and whenever dev already runs main, so a skipped one costs about a minute.
  schedule:
    - cron: '30 19 * * *'
    - cron: '30 20 * * *'
    - cron: '40 20 * * *'
    - cron: '40 21 * * *'
  workflow_dispatch:
    inputs:
      morning:
        description: Morning run (skip if dev already runs main)
        type: boolean
        default: false
      catchup:
        description: Catch-up run (deploy what the two-hour dev deploy limit held back; fast checks only)
        type: boolean
        default: false

# Per event, so a quiet-hours push never cancels the morning run on main. A new PR push cancels
# the PR's running CI. Main runs don't cancel each other: the running one finishes (and deploys)
# and only the newest waiting one runs next, so back-to-back merges can't keep dev from deploying.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Nx Cloud is optional and never required (fork PRs have no secrets).
  NX_NO_CLOUD: 'true'
  NX_DAEMON: 'false'
  FORCE_COLOR: '1'

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # find the last dev deploy
      pull-requests: read # list the PR's files
      issues: read # look for a dev deploy hold
    outputs:
      mode: ${{ steps.decide.outputs.mode }}
      base: ${{ steps.decide.outputs.base }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
      - id: decide
        name: Decide how much of CI to run
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          MORNING: ${{ inputs.morning }}
          CATCHUP: ${{ inputs.catchup }}
        run: .github/scripts/ci-gate.sh

  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: gate
    if: contains(fromJSON('["full", "main"]'), needs.gate.outputs.mode)
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
      e2e: ${{ steps.filter.outputs.e2e }}
      storybook: ${{ steps.filter.outputs.storybook }}
      jobs: ${{ steps.filter.outputs.jobs }}
      doc-services: ${{ steps.filter.outputs.doc-services }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          base: ${{ needs.gate.outputs.base }}
      - id: filter
        name: Detect affected areas
        run: |
          affected="$(pnpm -s nx show projects --affected --base="$NX_BASE" --head="$NX_HEAD")"
          echo "Affected projects:"; echo "$affected"
          if git diff --name-only "$NX_BASE" "$NX_HEAD" | grep -q '^infra/'; then echo "infra=true" >> "$GITHUB_OUTPUT"; else echo "infra=false" >> "$GITHUB_OUTPUT"; fi
          if echo "$affected" | grep -qx 'web-e2e'; then echo "e2e=true" >> "$GITHUB_OUTPUT"; else echo "e2e=false" >> "$GITHUB_OUTPUT"; fi
          if echo "$affected" | grep -qx 'ui'; then echo "storybook=true" >> "$GITHUB_OUTPUT"; else echo "storybook=false" >> "$GITHUB_OUTPUT"; fi
          if echo "$affected" | grep -qx 'jobs'; then echo "jobs=true" >> "$GITHUB_OUTPUT"; else echo "jobs=false" >> "$GITHUB_OUTPUT"; fi
          if echo "$affected" | grep -qx 'doc-services'; then echo "doc-services=true" >> "$GITHUB_OUTPUT"; else echo "doc-services=false" >> "$GITHUB_OUTPUT"; fi

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: gate
    if: needs.gate.outputs.mode != 'skip'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          base: ${{ needs.gate.outputs.base }}
      - run: pnpm exec prettier --check .
      - run: pnpm nx affected -t lint --base="$NX_BASE" --head="$NX_HEAD"
      # FND-07: libs/ui/src/generated and the web fonts must match design/ (needs python3, preinstalled).
      - name: Design outputs in sync
        run: pnpm materia-scripts sync-design --check
      - name: Feature flag report (owners, keys, flags fully on for over 90 days)
        run: pnpm materia-scripts flags-report

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: gate
    if: contains(fromJSON('["full", "main"]'), needs.gate.outputs.mode)
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          base: ${{ needs.gate.outputs.base }}
      - run: pnpm nx affected -t typecheck --base="$NX_BASE" --head="$NX_HEAD"

  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: gate
    if: contains(fromJSON('["full", "main"]'), needs.gate.outputs.mode)
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          base: ${{ needs.gate.outputs.base }}
      # Coverage thresholds live in each project's Vitest config (Testing & quality strategy).
      - run: pnpm nx affected -t test --base="$NX_BASE" --head="$NX_HEAD" --coverage
      - name: Upload coverage summaries
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-summary
          path: coverage/**/coverage-summary.json
          if-no-files-found: ignore
          retention-days: 30

  rules:
    name: rules
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: gate
    if: contains(fromJSON('["full", "main"]'), needs.gate.outputs.mode)
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          base: ${{ needs.gate.outputs.base }}
          java: 'true'
      # The firebase project depends implicitly on libs/domain and libs/test-utils, so changes to
      # firebase/**, libs/domain/** or libs/test-utils/** run the rules suite in the emulators.
      # The emulator builds the coverage report (over 250 MB of JSON) in memory: with the JVM's
      # default heap (a quarter of the runner's RAM) it answers 500 and the coverage test fails.
      - run: pnpm nx affected -t test-rules --base="$NX_BASE" --head="$NX_HEAD"
        env:
          JAVA_TOOL_OPTIONS: -Xmx4g
      # FND-14: rules coverage (fails below 90% of expressions inside test-rules) and its report.
      - name: Upload the rules coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rules-coverage
          path: dist/rules-coverage
          if-no-files-found: ignore
          retention-days: 14

  integration:
    name: integration
    runs-on: ubuntu-latest
    # A full run (most projects affected) takes 14-19 minutes; at 20 the INS-01 merge timed out,
    # which cancelled its main run and so its dev deploy.
    timeout-minutes: 30
    needs: gate
    if: contains(fromJSON('["full", "main"]'), needs.gate.outputs.mode)
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          base: ${{ needs.gate.outputs.base }}
          java: 'true'
      # FND-15: the callable wrapper and Cloud Tasks, through the auth, firestore and functions
      # emulators (builds functions first).
      - run: pnpm nx affected -t test-integration --base="$NX_BASE" --head="$NX_HEAD"
        env:
          # The same worker cap as e2e (see there). Uncapped, integration shard 1 filled the 7 GB
          # runner, the Firestore emulator was killed and the shard hit its 6-minute limit; capped, it
          # peaked at 4.3 GB (measured on 2 CPUs in a 7 GiB cgroup).
          FUNCTIONS_EMULATOR_MAX_WORKERS: '20'
          NODE_COMPILE_CACHE: ${{ runner.temp }}/node-compile-cache
      # FND-06: seed the emulators with the fictional practice, then validate every seeded document
      # against its domain schema and sign in as each test account.
      - run: pnpm nx affected -t test-seed --base="$NX_BASE" --head="$NX_HEAD"

  # FND-24: builds the Cloud Run jobs image exactly as deploy.yml does, then runs the PDF job inside
  # it (no network) against fixture PDFs: merge, stamp, bookmarks, determinism, bad inputs and the
  # 500-page budget. qpdf on the runner only inspects the outputs.
  jobs-container:
    name: jobs container
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [gate, changes]
    if: needs.gate.outputs.mode == 'full' && needs.changes.outputs.jobs == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Install qpdf
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qpdf
      - name: Build the bundle and the image
        run: |
          pnpm nx build jobs
          docker build -f apps/jobs/Dockerfile -t materia-jobs:ci dist/apps/jobs
      - name: Run the PDF job in the image
        env:
          JOBS_IMAGE: materia-jobs:ci
        run: pnpm exec vitest run -c apps/jobs/vitest.integration.config.mts
      # SEC-02: fixable high and critical vulnerabilities fail the change.
      - name: Scan the image
        uses: ./.github/actions/trivy
        with:
          images: materia-jobs:ci
          report-name: trivy-jobs

  # CORE-12a: builds the ClamAV and preview images exactly as deploy.yml does, then calls them over
  # HTTP: EICAR is infected and a plain file clean (real clamd, the image's signatures), a .docx
  # becomes a PDF (LibreOffice) and a HEIC photo a JPEG (heif-convert).
  doc-services-container:
    name: doc-services container
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [gate, changes]
    if: needs.gate.outputs.mode == 'full' && needs.changes.outputs.doc-services == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Build the bundle and the images
        run: |
          pnpm nx build doc-services
          docker build --pull -f dist/apps/doc-services/docker/scanner.Dockerfile -t materia-clamav:ci dist/apps/doc-services
          docker build --pull -f dist/apps/doc-services/docker/preview.Dockerfile -t materia-preview:ci dist/apps/doc-services
      - name: Call the services in their images
        env:
          SCANNER_IMAGE: materia-clamav:ci
          PREVIEW_IMAGE: materia-preview:ci
        run: pnpm exec vitest run -c apps/doc-services/vitest.integration.config.mts
      # SEC-02: fixable high and critical vulnerabilities fail the change.
      - name: Scan the images
        uses: ./.github/actions/trivy
        with:
          images: materia-clamav:ci materia-preview:ci
          report-name: trivy-doc-services

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [gate, changes]
    if: contains(fromJSON('["full", "main"]'), needs.gate.outputs.mode)
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          base: ${{ needs.gate.outputs.base }}
      - run: pnpm nx affected -t build --base="$NX_BASE" --head="$NX_HEAD" --configuration=production
      - name: Check gzip bundle budgets
        id: bundle
        run: |
          if [ -f dist/apps/web/browser/index.html ]; then
            pnpm -s materia-scripts bundle-size --dist dist/apps/web/browser --json bundle-report.json
          else
            echo "apps/web not affected; no bundle to check."
          fi
      - name: Upload bundle report
        if: always() && hashFiles('bundle-report.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: bundle-report
          path: bundle-report.json
          retention-days: 30
      - name: Build the e2e web app (emulator environment)
        if: needs.gate.outputs.mode == 'full' && needs.changes.outputs.e2e == 'true'
        run: |
          pnpm nx build web --configuration=e2e
          # Every inline script in the built index.html must be allowed by the Hosting CSP (FND-22).
          pnpm -s materia-scripts csp check --html dist/apps/web/browser/index.html
      - name: Upload the e2e web app
        if: needs.gate.outputs.mode == 'full' && needs.changes.outputs.e2e == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: web-e2e-dist
          path: dist/apps/web/browser
          retention-days: 3

  e2e:
    name: e2e (${{ matrix.browser }} ${{ matrix.shard == 'audit' && 'audit' || format('{0}/2', matrix.shard) }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [gate, changes, build]
    if: needs.gate.outputs.mode == 'full' && needs.changes.outputs.e2e == 'true'
    # PRs test Chromium only; the morning run and dispatches add WebKit (iPhone Safari). A WebKit
    # failure shows red on its job but doesn't fail the run: nothing tests WebKit before merge, so
    # blocking on it would stop every morning deploy. Fix what it finds in a follow-up PR.
    continue-on-error: ${{ matrix.browser == 'webkit' }}
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(github.event_name == 'pull_request' && '["chromium"]' || '["chromium", "webkit"]') }}
        shard: [1, 2]
        # The morning run and dispatches also run the accessibility audit, in a leg of its own (see
        # E2E_GREP below).
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[]' || '[{"browser":"chromium","shard":"audit"}]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          base: ${{ needs.gate.outputs.base }}
          java: 'true'
      - name: Download the e2e web app
        uses: actions/download-artifact@v8
        with:
          name: web-e2e-dist
          path: dist/apps/web/browser
      - name: Build functions for the emulator
        run: pnpm nx build functions
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      # Both browsers whatever the leg: e2e, perf and storybook share this cache.
      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium webkit
      # Only this leg's browser: WebKit's packages are most of the download, and PRs test Chromium only.
      # A PR that changes a phone screen (apps/web-e2e/phone-screen-files.txt) also runs the WebKit
      # phone audit from its Chromium leg (a11y-phone.spec.ts), so that leg needs WebKit's too.
      - name: Install Playwright system dependencies
        timeout-minutes: 11
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          browsers=$BROWSER
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ "$browsers" = chromium ]; then
            changed=$(git diff --name-only HEAD^1 HEAD || true)
            if grep -qE -f <(grep -vE '^(#|[[:space:]]*$)' apps/web-e2e/phone-screen-files.txt) <<<"$changed"; then
              echo "This PR changes a phone screen, so the WebKit phone audit runs: installing WebKit's packages too."
              browsers="chromium webkit"
            fi
          fi
          .github/scripts/playwright-deps.sh $browsers
      # The Hosting emulator serves the app with the real CSP plus the emulator origins (FND-22).
      - name: Write the e2e Firebase config
        run: pnpm -s materia-scripts csp emulator-config --out firebase.e2e.json
      - name: Run e2e against the emulators (project demo-materia)
        # Below the job's limit: a step that times out fails (which continue-on-error covers) where a
        # job that times out is cancelled, and a cancelled job cancels the run and so the deploy.
        timeout-minutes: 21
        env:
          BASE_URL: http://127.0.0.1:5000
          CI: 'true'
          # Seconds the Functions emulator waits for a function's worker to load (default 30). On a
          # busy runner a late first call has taken longer, failing with "Failed to load function";
          # test-integration sets the same.
          FUNCTIONS_DISCOVERY_TIMEOUT: '120'
          # The Functions emulator keeps a worker process (the whole functions bundle, about 150 MB)
          # for every function called and never stops one: a shard reached 79 workers and 12 GB on a
          # 7 GB runner, which swapped until a 20 ms trigger took a second and saves timed out. Our
          # firebase-tools patch (patches/) stops the workers idle longest beyond this many.
          FUNCTIONS_EMULATOR_MAX_WORKERS: '20'
          # Workers load the bundle from V8's code cache after the first: about a third faster.
          NODE_COMPILE_CACHE: ${{ runner.temp }}/node-compile-cache
          E2E_CHROMIUM_ONLY: ${{ matrix.browser == 'chromium' && '1' || '' }}
          E2E_PROJECT: ${{ matrix.browser == 'chromium' && 'chromium' || 'webkit-mobile' }}
          E2E_SHARD: ${{ matrix.shard != 'audit' && format('--shard={0}/2', matrix.shard) || '' }}
          E2E_LOAD: ${{ matrix.browser == 'chromium' && matrix.shard != 'audit' && format('&& pnpm exec playwright test -c apps/web-e2e/playwright.config.mts --project=chromium-load --no-deps --shard={0}/2', matrix.shard) || '' }}
          # The exhaustive accessibility audit (a11y-audit.spec.ts, tagged @audit: every route in both
          # themes, 7 to 9 minutes of test time) runs in the morning run and dispatches, in Chromium's
          # audit leg; PRs run the faster checks in a11y.spec.ts (SEC-06). Playwright shards by test
          # count in file order, so in a Chromium shard the audit all landed in shard 1, which then
          # ran past its limit every morning. WebKit's shards keep it: there only its phone-width
          # test runs (the others skip on a phone).
          E2E_GREP: ${{ matrix.shard == 'audit' && '--grep @audit' || matrix.browser == 'chromium' && '--grep-invert @audit' || '' }}
        # The browser projects are named so they shard on their own: with no --project, chromium-load's
        # dependency on them put every test in shard 1 and none in shard 2. The load test then runs
        # after its shard's browser tests (--no-deps; a shard without it exits at once).
        run: >-
          pnpm exec firebase emulators:exec --only auth,firestore,functions,storage,hosting
          --project demo-materia --config firebase.e2e.json
          "pnpm exec playwright test -c apps/web-e2e/playwright.config.mts --project=$E2E_PROJECT $E2E_SHARD
          $E2E_GREP $E2E_LOAD"
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.browser }}-${{ matrix.shard }}
          path: dist/.playwright/apps/web-e2e
          retention-days: 7

  # Performance budgets (SEC-07): Firestore reads per screen and Web Vitals on a mid-tier phone
  # (Lighthouse's mobile profile; INP from Event Timing with the CPU slowed 4x) for Today, Matters,
  # a matter and Deadlines, signed in to the large practice (`seed-large --scale 0.05`) in the
  # emulators. The morning run and dispatches only (like CodeQL), and like WebKit a failure shows
  # red on this job without failing the run or holding the dev deploy (it isn't in ci-ok).
  # Budgets and their exceptions: docs/ops/perf-report-2026-10.md.
  perf:
    name: perf
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [gate, changes, build]
    if: needs.gate.outputs.mode == 'full' && github.event_name != 'pull_request' && needs.changes.outputs.e2e == 'true'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          base: ${{ needs.gate.outputs.base }}
          java: 'true'
      - name: Download the e2e web app
        uses: actions/download-artifact@v8
        with:
          name: web-e2e-dist
          path: dist/apps/web/browser
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      # Both browsers: the e2e job shares this cache.
      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium webkit
      - name: Install Playwright system dependencies
        timeout-minutes: 11
        run: .github/scripts/playwright-deps.sh chromium
      - name: Write the e2e Firebase config
        run: pnpm -s materia-scripts csp emulator-config --out firebase.e2e.json
      # No Functions: the screens measured call none while loading, and the seed's writes would
      # set off every trigger. The seed writes about 136,000 documents in under a minute.
      - name: Seed the large practice and measure (project demo-materia)
        timeout-minutes: 12
        env:
          BASE_URL: http://127.0.0.1:5000
          CI: 'true'
          E2E_PERF: '1'
          E2E_CHROMIUM_ONLY: '1'
          PERF_OUT_DIR: dist/perf
        run: >-
          pnpm exec firebase emulators:exec --only auth,firestore,hosting
          --project demo-materia --config firebase.e2e.json
          "pnpm -s materia-scripts seed-large --scale 0.05 &&
          pnpm exec playwright test -c apps/web-e2e/playwright.config.mts --project=chromium-perf"
      - name: Upload the perf reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-reports
          path: |
            dist/perf
            dist/.playwright/apps/web-e2e/playwright-report
          retention-days: 30

  terraform:
    name: terraform
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [gate, changes]
    if: needs.gate.outputs.mode == 'full' && needs.changes.outputs.infra == 'true'
    env:
      TERRAFORM_VERSION: 1.16.5
      TFLINT_VERSION: 0.55.0
      CHECKOV_VERSION: 3.3.22
    steps:
      - uses: actions/checkout@v7
      - name: Install Terraform (checksum-verified)
        run: |
          cd "$RUNNER_TEMP"
          base="https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}"
          curl -fsSLO "$base/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          curl -fsSLO "$base/terraform_${TERRAFORM_VERSION}_SHA256SUMS"
          sha256sum -c --ignore-missing "terraform_${TERRAFORM_VERSION}_SHA256SUMS"
          unzip -q "terraform_${TERRAFORM_VERSION}_linux_amd64.zip" -d "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Install tflint (checksum-verified)
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/terraform-linters/tflint/releases/download/v${TFLINT_VERSION}"
          curl -fsSLO "$base/tflint_linux_amd64.zip"
          curl -fsSLO "$base/checksums.txt"
          sha256sum -c --ignore-missing checksums.txt
          unzip -q -o tflint_linux_amd64.zip -d "$RUNNER_TEMP/bin"
      - name: Install checkov
        run: pipx install "checkov==${CHECKOV_VERSION}"
      - name: fmt
        run: terraform -chdir=infra/terraform fmt -check -recursive
      - name: validate
        run: |
          for dir in infra/terraform infra/terraform/bootstrap; do
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done
      - name: tflint
        run: tflint --chdir=infra/terraform --recursive
      - name: checkov
        run: checkov -d infra/terraform --framework terraform --compact --quiet

  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: gate
    if: needs.gate.outputs.mode == 'full'
    permissions:
      contents: read
      security-events: write
      actions: read # CodeQL reads the workflow run's metadata
    env:
      GITLEAKS_VERSION: 8.24.0
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          base: ${{ needs.gate.outputs.base }}
      - name: pnpm audit (production dependencies)
        run: pnpm audit --prod --audit-level=high
      - name: Install gitleaks (checksum-verified)
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSLO "$base/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum -c --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      # Default rules plus Materia's own (.gitleaks.toml): service account keys, Anthropic and Resend keys.
      - name: gitleaks (commits in this change)
        run: gitleaks git --redact --no-banner --log-opts="$NX_BASE..$NX_HEAD" .
      - name: gitleaks custom rules still fire
        run: .github/scripts/gitleaks-selftest.sh
      # CodeQL takes ~3-4 min, so to save Actions minutes it runs once a day in CI's morning run (and
      # on manual dispatches), over everything merged since the last dev deploy, not on PRs.
      - name: Detect code changes
        id: scope
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then echo "code=false" >> "$GITHUB_OUTPUT"; echo "PR: CodeQL runs in the morning run."; exit 0; fi
          code_files="$(git diff --name-only "$NX_BASE" "$NX_HEAD" | grep -Ev '(^docs/|^design/|^LICENSE$|\.md$)' || true)"
          if [ -n "$code_files" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; else echo "code=false" >> "$GITHUB_OUTPUT"; echo "Docs-only change: skipping CodeQL."; fi
      - name: CodeQL init
        if: steps.scope.outputs.code == 'true'
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - name: CodeQL analyze
        if: steps.scope.outputs.code == 'true'
        uses: github/codeql-action/analyze@v4
        with:
          # Uploading needs GitHub Advanced Security on private repos; the gate below works without it.
          upload: never
          output: sarif-results
      - name: Fail on high-severity CodeQL findings
        if: steps.scope.outputs.code == 'true'
        run: |
          node -e '
            const fs = require("fs"), path = require("path");
            const dir = "sarif-results";
            const findings = [];
            for (const file of fs.readdirSync(dir).filter((f) => f.endsWith(".sarif"))) {
              const sarif = JSON.parse(fs.readFileSync(path.join(dir, file), "utf8"));
              for (const run of sarif.runs) {
                const rules = Object.fromEntries((run.tool.driver.rules || []).map((r) => [r.id, r]));
                for (const result of run.results || []) {
                  const severity = Number(rules[result.ruleId]?.properties?.["security-severity"] ?? 0);
                  if (severity >= 7) findings.push(`${result.ruleId} (${severity}): ${result.locations?.[0]?.physicalLocation?.artifactLocation?.uri}`);
                }
              }
            }
            if (findings.length) { console.error("High-severity CodeQL findings:\n" + findings.join("\n")); process.exit(1); }
            console.log("No high-severity CodeQL findings.");
          '
      - name: Upload CodeQL SARIF
        if: always() && steps.scope.outputs.code == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: codeql-sarif
          path: sarif-results
          if-no-files-found: ignore
          retention-days: 14

  summary:
    name: summary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [gate, unit, build]
    if: always() && github.event_name == 'pull_request' && needs.gate.outputs.mode == 'full'
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Download this run's reports
        uses: actions/download-artifact@v8
        with:
          path: reports
          pattern: '{coverage-summary,bundle-report}'
        continue-on-error: true
      - name: Download the latest main baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The newest green main run that produced reports (quiet-hours and docs-only runs have none).
          run_ids="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --status success --limit 10 --json databaseId,event -q '.[] | select(.event != "pull_request") | .databaseId' || true)"
          for run_id in $run_ids; do
            if gh run download "$run_id" --repo "$GITHUB_REPOSITORY" -n coverage-summary -D base/coverage 2>/dev/null; then
              gh run download "$run_id" --repo "$GITHUB_REPOSITORY" -n bundle-report -D base/bundle || true
              break
            fi
          done
      - name: Render the summary
        run: |
          args=(--coverage reports/coverage-summary --out summary.md)
          [ -d base/coverage ] && args+=(--base-coverage base/coverage)
          [ -f reports/bundle-report/bundle-report.json ] && args+=(--bundle reports/bundle-report/bundle-report.json)
          [ -f base/bundle/bundle-report.json ] && args+=(--base-bundle base/bundle/bundle-report.json)
          pnpm -s materia-scripts ci-summary "${args[@]}"
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Post or update the PR comment
        # Fork PRs get a read-only token; the job summary above still shows the report.
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('summary.md', 'utf8');
            const marker = '<!-- materia-ci-summary -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.user.type === 'Bot' && c.body.includes(marker));
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });

  storybook:
    name: storybook
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [gate, changes]
    if: needs.gate.outputs.mode == 'full' && needs.changes.outputs.storybook == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          base: ${{ needs.gate.outputs.base }}
      - name: Build Storybook
        run: pnpm nx run ui:build-storybook
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      # Both browsers: the e2e job shares this cache.
      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium webkit
      - name: Install Playwright system dependencies
        timeout-minutes: 11
        run: .github/scripts/playwright-deps.sh chromium
      # Every story's play function plus the a11y checks (violations fail, parameters.a11y.test = 'error').
      - name: Storybook test-runner
        run: |
          python3 -m http.server 6006 --bind 127.0.0.1 --directory dist/storybook/ui >/dev/null 2>&1 &
          for _ in $(seq 30); do curl -fsS -o /dev/null http://127.0.0.1:6006/index.html && break; sleep 1; done
          pnpm exec test-storybook -c libs/ui/.storybook --url http://127.0.0.1:6006

  ci-ok:
    name: ci-ok
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      [
        gate,
        changes,
        lint,
        typecheck,
        unit,
        rules,
        integration,
        jobs-container,
        doc-services-container,
        build,
        e2e,
        storybook,
        terraform,
        security,
      ]
    if: always()
    steps:
      - name: Every job succeeded or was skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | node -e '
            const needs = JSON.parse(require("fs").readFileSync(0, "utf8"));
            const bad = Object.entries(needs).filter(([, v]) => !["success", "skipped"].includes(v.result));
            for (const [job, v] of Object.entries(needs)) console.log(`${job}: ${v.result}`);
            if (bad.length) { console.error(`Failed: ${bad.map(([j]) => j).join(", ")}`); process.exit(1); }
          '
