# Continuous deployment to dev (FND-05). Every push to main whose CI run succeeds (`ci-ok` green)
# is built once and deployed to materia-v2-dev, then smoke-tested. CI runs that skipped their
# `build` job deploy nothing: quiet-hour merges (22:00-07:30 Melbourne) and docs-only changes wait
# for CI's morning run, which deploys whatever main has gained since the last dev deploy (ci.yml).
# Daytime pushes deploy at most once every two hours: a push within two hours of the last dev
# deploy is left for CI's hourly catch-up run (ci.yml), except release commits. An open issue
# labelled dev-deploy-hold stops every dev deploy (.github/scripts/dev-deploy-hold.sh). MVP has no staging project:
# dev plays that role. The same run builds the prod web bundle from the same commit and keeps the
# whole release as the artifact release-<sha>, which deploy-prod.yml promotes without rebuilding.
#
# Needs: GCP_PROJECT_DEV, GCP_WIF_PROVIDER_DEV, GCP_DEPLOYER_SA_DEV and FIREBASE_WEB_CONFIG_DEV
# (`terraform output -raw web_app_config`). FIREBASE_WEB_CONFIG_PROD is optional here; without it
# the release has no prod bundle and cannot be promoted.
name: deploy-dev
# A hosting-only dispatch says so in its name: last-dev-deploy.sh doesn't count it as a dev deploy.
run-name: deploy-dev ${{ inputs.hosting-only && 'hosting-only ' || '' }}${{ github.event.workflow_run.head_sha || github.sha }}

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  # Re-deploy the current main (for example after a failed run, or to rebuild an expired artifact).
  workflow_dispatch:
    inputs:
      hosting-only:
        description: Deploy only the web app (hosting), for when the functions already match main.
        type: boolean
        default: false

# Deploys queue; a running deploy is never cancelled halfway.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Until the owner sets FIREBASE_WEB_CONFIG_DEV (one-time setup in docs/runbooks/deploy.md), the
  # deploy is skipped with a notice instead of failing every push to main.
  preflight:
    name: preflight
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       contains(fromJSON('["push", "schedule", "workflow_dispatch"]'), github.event.workflow_run.event))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # read the CI run's jobs
      issues: read # look for a dev deploy hold
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
      - id: check
        env:
          WEB_CONFIG: ${{ vars.FIREBASE_WEB_CONFIG_DEV }}
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
          CI_EVENT: ${{ github.event.workflow_run.event }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -z "$WEB_CONFIG" ]; then
            echo "::notice::Dev deploy skipped: set the FIREBASE_WEB_CONFIG_DEV repository variable (docs/runbooks/deploy.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # An open issue labelled dev-deploy-hold stops every dev deploy, dispatches included.
          if hold="$(.github/scripts/dev-deploy-hold.sh)"; then
            echo "::notice::Dev deploy held by $hold. Close that issue to lift the hold, then dispatch deploy-dev."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$CI_RUN_ID" ]; then
            build="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID/jobs?per_page=100" --jq '[.jobs[] | select(.name == "build")][0].conclusion')"
            if [ "$build" != "success" ]; then
              echo "::notice::Dev deploy skipped: CI didn't build this commit (quiet hours or docs-only). CI's morning run deploys it, or dispatch deploy-dev."
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          # Two-hour batching (ci.yml): release commits always deploy, so deploy-prod finds them.
          if [ "$CI_EVENT" = push ] &&
            ! gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA" --jq '.files[].filename' | grep -qx '\.release-please-manifest\.json'; then
            read -r _ mins state <<< "$(.github/scripts/last-dev-deploy.sh || true)" || true
            if [ "${state:-}" = recent ]; then
              echo "::notice::Dev deploy batched: dev deployed $mins min ago. CI's hourly catch-up run deploys this once two hours have passed, or dispatch deploy-dev."
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

  build:
    name: build release
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: ./.github/actions/setup

      - name: Release version and commit
        id: release
        run: |
          sha="$(git rev-parse HEAD)"
          version="v$(node -p 'require("./.release-please-manifest.json")["."]')"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "SHA=$sha" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "Building $version ($sha)"

      - name: Build the web app for dev
        env:
          WEB_CONFIG: ${{ vars.FIREBASE_WEB_CONFIG_DEV }}
        run: |
          pnpm materia-scripts env --env dev --web-config "$WEB_CONFIG"
          pnpm materia-scripts stamp --target web --version "$VERSION" --sha "$SHA"
          pnpm nx build web --configuration=dev --skip-nx-cache
          pnpm -s materia-scripts csp check --html dist/apps/web/browser/index.html
          mkdir -p dist/release && mv dist/apps/web/browser dist/release/web-dev

      - name: Build the web app for prod (same commit, prod Firebase config)
        env:
          WEB_CONFIG: ${{ vars.FIREBASE_WEB_CONFIG_PROD }}
        run: |
          if [ -z "$WEB_CONFIG" ]; then
            echo "::notice::FIREBASE_WEB_CONFIG_PROD is not set, so this release has no prod bundle and cannot be promoted."
            exit 0
          fi
          pnpm materia-scripts env --env prod --web-config "$WEB_CONFIG"
          pnpm nx build web --configuration=prod --skip-nx-cache
          pnpm -s materia-scripts csp check --html dist/apps/web/browser/index.html
          mv dist/apps/web/browser dist/release/web-prod

      # The bundle only; deploy.yml builds the image from it with apps/jobs/Dockerfile (FND-24).
      - name: Build the Cloud Run jobs bundle
        run: |
          pnpm nx build jobs --skip-nx-cache
          mv dist/apps/jobs dist/release/jobs
          cp apps/jobs/Dockerfile dist/release/jobs/Dockerfile

      # The bundle only; deploy.yml builds the ClamAV and preview images from it (CORE-12a).
      - name: Build the document services bundle
        run: |
          pnpm nx build doc-services --skip-nx-cache
          mv dist/apps/doc-services dist/release/doc-services

      - name: Build functions
        run: |
          pnpm nx build functions --skip-nx-cache
          pnpm materia-scripts stamp --target functions --version "$VERSION" --sha "$SHA"
          mv dist/apps/functions dist/release/functions
          node -e 'require("fs").writeFileSync("dist/release/release.json", JSON.stringify({ version: process.env.VERSION, sha: process.env.SHA }, null, 2) + "\n")'

      # Kept for 90 days so a tag can be promoted to prod and older releases redeployed.
      - name: Upload the release
        uses: actions/upload-artifact@v6
        with:
          name: release-${{ steps.release.outputs.sha }}
          path: dist/release
          include-hidden-files: true # functions/.env carries the release stamp
          retention-days: 90
          if-no-files-found: error

  deploy:
    needs: build
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      actions: read
      id-token: write
    with:
      environment: dev
      suffix: DEV
      sha: ${{ needs.build.outputs.sha }}
      artifact-run-id: ${{ github.run_id }}
      web-dir: web-dev
      hosting-only: ${{ github.event_name == 'workflow_dispatch' && inputs.hosting-only }}
