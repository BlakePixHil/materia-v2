# Reusable deploy (FND-05), called by deploy-dev.yml and deploy-prod.yml. It deploys a release
# artifact built once by deploy-dev.yml (no rebuild; only the jobs and services images are assembled
# here from the release's bundles), in a fixed order, then runs the @smoke Playwright tests against
# the deployed site. Order: Firestore indexes → rules (Firestore and Storage) → Cloud Run jobs →
# Cloud Run services (ClamAV, previews) → functions (codebase `core`) → hosting. A failure stops the
# run loudly. The only automatic retry is for functions that fail to update (two more attempts of
# just those, 5 and 10 minutes later, for the regional CPU quota); docs/runbooks/deploy.md covers
# partial deploys.
#
# Settings come from variables named <NAME>_<DEV|PROD> (repository or environment variables):
# GCP_PROJECT_*, GCP_WIF_PROVIDER_* and GCP_DEPLOYER_SA_*. No JSON keys anywhere.
name: deploy

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment (dev or production). production has required reviewers.
        required: true
        type: string
      suffix:
        description: Variable suffix, DEV or PROD.
        required: true
        type: string
      sha:
        description: Commit being deployed (checked against the artifact's release.json).
        required: true
        type: string
      artifact-run-id:
        description: Run that uploaded the release-<sha> artifact.
        required: true
        type: string
      web-dir:
        description: Web bundle inside the artifact (web-dev or web-prod).
        required: true
        type: string
      hosting-only:
        description: Deploy only hosting (and run the smoke tests), skipping indexes, rules, jobs, services and functions.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy:
    name: deploy (${{ inputs.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 60 # includes up to 15 minutes of functions retry waits
    environment:
      name: ${{ inputs.environment }}
      url: https://${{ vars[format('GCP_PROJECT_{0}', inputs.suffix)] }}.web.app
    permissions:
      contents: read
      actions: read # download the artifact from another run
      id-token: write # GitHub OIDC token for Workload Identity Federation
    env:
      PROJECT: ${{ vars[format('GCP_PROJECT_{0}', inputs.suffix)] }}
      REGION: australia-southeast1
    steps:
      - name: Check the environment's variables
        env:
          WIF_PROVIDER: ${{ vars[format('GCP_WIF_PROVIDER_{0}', inputs.suffix)] }}
          DEPLOYER_SA: ${{ vars[format('GCP_DEPLOYER_SA_{0}', inputs.suffix)] }}
        run: |
          missing=""
          [ -n "$PROJECT" ] || missing="$missing GCP_PROJECT_${{ inputs.suffix }}"
          [ -n "$WIF_PROVIDER" ] || missing="$missing GCP_WIF_PROVIDER_${{ inputs.suffix }}"
          [ -n "$DEPLOYER_SA" ] || missing="$missing GCP_DEPLOYER_SA_${{ inputs.suffix }}"
          if [ -n "$missing" ]; then
            echo "::error::Missing variables:$missing (docs/runbooks/deploy.md, one-time setup)."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}

      - uses: ./.github/actions/setup

      - name: Download the release artifact
        uses: actions/download-artifact@v4
        with:
          name: release-${{ inputs.sha }}
          path: dist/release
          run-id: ${{ inputs.artifact-run-id }}
          github-token: ${{ github.token }}

      - name: Unpack the release into the paths firebase.json deploys
        env:
          SHA: ${{ inputs.sha }}
          WEB_DIR: ${{ inputs.web-dir }}
        run: |
          node -e '
            const r = require("./dist/release/release.json");
            if (r.sha !== process.env.SHA) { console.error(`release.json is for ${r.sha}, not ${process.env.SHA}`); process.exit(1); }
            console.log(`Release ${r.version} (${r.sha})`);
          '
          if [ ! -d "dist/release/$WEB_DIR" ]; then
            echo "::error::The artifact has no $WEB_DIR bundle. For web-prod, set FIREBASE_WEB_CONFIG_PROD and re-run deploy-dev for this commit."
            exit 1
          fi
          rm -rf dist/apps/web/browser dist/apps/functions dist/apps/jobs dist/apps/doc-services
          mkdir -p dist/apps/web
          mv "dist/release/$WEB_DIR" dist/apps/web/browser
          mv dist/release/functions dist/apps/functions
          if [ -d dist/release/jobs ]; then mv dist/release/jobs dist/apps/jobs; fi
          if [ -d dist/release/doc-services ]; then mv dist/release/doc-services dist/apps/doc-services; fi
          echo "VERSION=$(node -p 'require("./dist/release/release.json").version')" >> "$GITHUB_ENV"

      - name: Authenticate to Google Cloud (Workload Identity Federation, no key)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars[format('GCP_WIF_PROVIDER_{0}', inputs.suffix)] }}
          service_account: ${{ vars[format('GCP_DEPLOYER_SA_{0}', inputs.suffix)] }}

      # --non-interactive makes the CLI fail instead of prompting (for example before deleting a
      # function). Functions are never deployed with --force.
      - name: Deploy Firestore indexes
        if: ${{ !inputs.hosting-only }}
        run: pnpm exec firebase deploy --only firestore:indexes --project "$PROJECT" --config firebase.json --non-interactive

      - name: Deploy Firestore and Storage rules
        if: ${{ !inputs.hosting-only }}
        run: pnpm exec firebase deploy --only firestore:rules,storage --project "$PROJECT" --config firebase.json --non-interactive

      # Functions start job executions, so the job is updated first (ADR-014, FND-24). The image is
      # built from the release's jobs bundle (same code and lockfile as dev), pushed to the
      # environment's Artifact Registry (scanned on push) and deployed as the job `pdf`. Releases
      # from before FND-24 carry no jobs bundle and skip this step.
      - name: Deploy Cloud Run jobs
        if: ${{ !inputs.hosting-only }}
        env:
          SHA: ${{ inputs.sha }}
        run: |
          if [ ! -d dist/apps/jobs ]; then
            echo "::notice::This release has no Cloud Run jobs bundle; jobs left as they are."
            exit 0
          fi
          image="$REGION-docker.pkg.dev/$PROJECT/jobs/pdf:$SHA"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -f dist/apps/jobs/Dockerfile -t "$image" dist/apps/jobs
          docker push "$image"
          gcloud run jobs deploy pdf \
            --project "$PROJECT" \
            --region "$REGION" \
            --image "$image" \
            --service-account "jobs-runtime@$PROJECT.iam.gserviceaccount.com" \
            --tasks 1 \
            --max-retries 0 \
            --task-timeout 30m \
            --cpu 2 \
            --memory 2Gi \
            --set-env-vars "GOOGLE_CLOUD_PROJECT=$PROJECT,STORAGE_BUCKET=$PROJECT-files" \
            --labels "app=materia,release=${SHA:0:12}" \
            --quiet
          echo "JOBS_IMAGE=$image" >> "$GITHUB_ENV"

      # The ClamAV scan service and the Office/HEIC preview service (CORE-12a, ADR-028), private
      # Cloud Run services the functions call with ID tokens. Images are built from the release's
      # bundle into the `services` repository; the scanner's build pulls the day's signatures.
      # Releases from before CORE-12a carry no bundle and skip this step.
      - name: Deploy Cloud Run services
        if: ${{ !inputs.hosting-only }}
        env:
          SHA: ${{ inputs.sha }}
        run: |
          if [ ! -d dist/apps/doc-services ]; then
            echo "::notice::This release has no document services bundle; services left as they are."
            exit 0
          fi
          .github/scripts/deploy-doc-services.sh dist/apps/doc-services "$SHA" clamav preview

      # Runtime configuration for the functions (apps/functions/src/core/params.ts), appended to the
      # release's .env: the document services' URLs, read from the deployed services. A service
      # that doesn't exist leaves its URL empty: uploads then stay "Scanning delayed" (fail closed)
      # and Office/HEIC files have no preview.
      - name: Point the functions at the document services
        if: ${{ !inputs.hosting-only }}
        run: |
          url() { gcloud run services describe "$1" --project "$PROJECT" --region "$REGION" --format 'value(status.url)' 2>/dev/null || true; }
          clamav="$(url clamav)"
          preview="$(url preview)"
          printf 'CLAMAV_SCAN_URL=%s\nPREVIEW_SERVICE_URL=%s\n' "$clamav" "$preview" >> dist/apps/functions/.env
          [ -n "$clamav" ] || echo "::warning::No clamav service in $PROJECT: uploads stay \"Scanning delayed\" (ADR-028)."
          [ -n "$preview" ] || echo "::warning::No preview service in $PROJECT: Office and HEIC files have no preview."
          echo "CLAMAV_SCAN_URL=$clamav" >> "$GITHUB_ENV"

      # The CLI loads dist/apps/functions to list its triggers (firebase-functions resolves from the
      # workspace node_modules); Cloud Build installs from the generated package.json and lockfile.
      # A full deploy rolls every function at once: each new revision starts an instance (1 vCPU)
      # for its health check, and instances stay up to 15 minutes after they go idle. So on dev some
      # new revisions can fail on the regional Cloud Run CPU quota ("Quota exceeded for total
      # allowable CPU per project per region"), more so when deploys run back to back. The functions
      # that failed are redeployed on their own, after 5 and then 10 minutes so the burst's idle
      # instances can drain; a failure with no function list (a build error, say) fails straight
      # away. Inline rather than a script because the checkout is
      # the release's commit, which may predate any script.
      - name: Deploy functions (codebase core)
        if: ${{ !inputs.hosting-only }}
        run: |
          set -o pipefail
          only=functions:core
          for attempt in 1 2 3; do
            if pnpm exec firebase deploy --only "$only" --project "$PROJECT" --config firebase.json --non-interactive 2>&1 | tee "$RUNNER_TEMP/functions-deploy.log"; then
              exit 0
            fi
            # The CLI ends with "Functions deploy had errors with the following functions:" and one
            # "<tab>core:<id>(<region>)" line per failed function.
            failed="$(sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/functions-deploy.log" \
              | sed -n '/Functions deploy had errors with the following functions:/,/^[^[:space:]]/p' \
              | sed -n 's/^[[:space:]]\{1,\}core:\([A-Za-z0-9_-]\{1,\}\)(.*$/\1/p' | sort -u | paste -sd' ')"
            if [ -z "$failed" ]; then
              echo "::error::The functions deploy failed without a list of failed functions; not retrying."
              exit 1
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error::These functions still failed after three attempts: $failed"
              exit 1
            fi
            wait=$((attempt * 5))
            echo "::warning::Functions deploy attempt $attempt failed for: $failed. Retrying just those in $wait minutes."
            only="$(echo "$failed" | tr ' ' '\n' | sed 's/^/functions:core:/' | paste -sd,)"
            sleep $((wait * 60))
          done

      # Hidden sourcemaps (FND-21) are never served: they go to the private sourcemaps bucket for
      # `materia-scripts decode-stack`, then leave the hosting directory (firebase.json also ignores
      # *.map). A failed upload only warns; it never blocks a deploy.
      - name: Upload sourcemaps privately
        env:
          SHA: ${{ inputs.sha }}
        run: |
          shopt -s nullglob
          maps=(dist/apps/web/browser/*.map)
          if [ ${#maps[@]} -eq 0 ]; then
            echo "::notice::This release has no sourcemaps."
            exit 0
          fi
          if ! gcloud storage cp "${maps[@]}" "gs://$PROJECT-sourcemaps/web/$SHA/" --quiet; then
            echo "::warning::Sourcemaps not uploaded to gs://$PROJECT-sourcemaps (apply infra/terraform first); stacks for $SHA can't be decoded."
          fi
          rm -f "${maps[@]}"

      - name: Deploy hosting
        run: pnpm exec firebase deploy --only hosting --project "$PROJECT" --config firebase.json --non-interactive --message "$VERSION ${{ inputs.sha }}"

      - name: Install Chromium for the smoke tests
        run: pnpm exec playwright install --with-deps chromium

      - name: Smoke tests against the deployed site (read-only)
        env:
          BASE_URL: https://${{ env.PROJECT }}.web.app
          FUNCTIONS_URL: https://${{ env.REGION }}-${{ env.PROJECT }}.cloudfunctions.net
          EXPECTED_SHA: ${{ inputs.sha }}
          CI: 'true'
          # A hosting-only deploy leaves the functions on an earlier release, so their sha won't match.
          SKIP_FUNCTIONS: ${{ inputs.hosting-only && 'system-ping' || '' }}
        run: pnpm exec playwright test -c apps/web-e2e/playwright.config.mts --grep @smoke --project=chromium ${SKIP_FUNCTIONS:+--grep-invert "$SKIP_FUNCTIONS"}

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report-${{ inputs.environment }}
          path: dist/.playwright/apps/web-e2e
          retention-days: 14

      - name: Summary
        run: |
          {
            echo "### Deployed $VERSION to ${{ inputs.environment }}"
            echo ""
            echo "- Commit: \`${{ inputs.sha }}\`"
            echo "- Site: https://$PROJECT.web.app/health"
            echo "- Jobs image: \`${JOBS_IMAGE:-unchanged}\`"
            echo "- Scanner: ${CLAMAV_SCAN_URL:-not deployed}"
            echo "- Rollback: docs/runbooks/rollback.md"
          } >> "$GITHUB_STEP_SUMMARY"
