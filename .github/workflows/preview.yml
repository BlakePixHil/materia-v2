# PR previews (FND-05). Each pull request from a branch of this repository gets the web app on
# the Hosting channel pr-<number> of materia-v2-dev (expires after 7 days), and a comment with
# the URL. Functions are not deployed per PR: previews call the dev project's functions, which
# come from main, so a PR that changes a callable shows the old behaviour until it merges.
# Fork PRs get no preview (they have no access to the deploy identity).
# Hosting caps the number of channels per site, so a closed PR's channel is deleted when it closes,
# and every preview run first deletes the channels of PRs that are no longer open.
# To save Actions minutes, only PRs that can change the web app get a preview, and none are built
# in quiet hours (22:00-07:30 Melbourne): the next push after 07:30 builds it.
name: preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - 'apps/web/**'
      - 'libs/**'
      - 'design/**'
      - 'tools/scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'firebase.json'
      - 'nx.json'
      - 'tsconfig.base.json'
      - '.github/actions/setup/**'
      - '.github/workflows/preview.yml'
      - '.github/scripts/prune-preview-channels.mjs'

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # Workload Identity Federation
      pull-requests: write # the preview comment
    env:
      PROJECT: ${{ vars.GCP_PROJECT_DEV }}
      CHANNEL: pr-${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check the dev variables and the time
        id: ready
        env:
          WEB_CONFIG: ${{ vars.FIREBASE_WEB_CONFIG_DEV }}
          WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER_DEV }}
          DEPLOYER_SA: ${{ vars.GCP_DEPLOYER_SA_DEV }}
        run: |
          now=$((10#$(TZ=Australia/Melbourne date +%H%M)))
          if [ -z "$WEB_CONFIG" ] || [ -z "$PROJECT" ] || [ -z "$WIF_PROVIDER" ] || [ -z "$DEPLOYER_SA" ]; then
            echo "::notice::Preview skipped: set FIREBASE_WEB_CONFIG_DEV, GCP_PROJECT_DEV, GCP_WIF_PROVIDER_DEV and GCP_DEPLOYER_SA_DEV (docs/runbooks/deploy.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [ "$now" -ge 2200 ] || [ "$now" -lt 730 ]; then
            echo "::notice::Preview skipped in quiet hours (22:00-07:30 Melbourne); the next push after 07:30 builds it."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.ready.outputs.ready == 'true'
        with:
          ref: ${{ env.SHA }}

      - uses: ./.github/actions/setup
        if: steps.ready.outputs.ready == 'true'

      - name: Build the web app for dev
        if: steps.ready.outputs.ready == 'true'
        env:
          WEB_CONFIG: ${{ vars.FIREBASE_WEB_CONFIG_DEV }}
        run: |
          pnpm materia-scripts env --env dev --web-config "$WEB_CONFIG"
          pnpm materia-scripts stamp --target web --version "$CHANNEL" --sha "$SHA"
          pnpm nx build web --configuration=dev --skip-nx-cache
          pnpm -s materia-scripts csp check --html dist/apps/web/browser/index.html

      - name: Authenticate to Google Cloud (Workload Identity Federation, no key)
        if: steps.ready.outputs.ready == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER_DEV }}
          service_account: ${{ vars.GCP_DEPLOYER_SA_DEV }}

      - name: Delete the channels of closed PRs
        if: steps.ready.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm exec node .github/scripts/prune-preview-channels.mjs

      - name: Deploy the preview channel
        id: deploy
        if: steps.ready.outputs.ready == 'true'
        run: |
          # --json sends errors to stdout too, so show the file when the CLI fails.
          if ! pnpm exec firebase hosting:channel:deploy "$CHANNEL" --expires 7d \
            --project "$PROJECT" --config firebase.json --non-interactive --json > "$RUNNER_TEMP/channel.json"; then
            cat "$RUNNER_TEMP/channel.json"
            exit 1
          fi
          url="$(node -e '
            const out = require(process.argv[1]);
            if (out.status !== "success") { console.error(JSON.stringify(out)); process.exit(1); }
            const sites = Object.values(out.result);
            console.log(sites[0].url);
          ' "$RUNNER_TEMP/channel.json")"
          expires="$(node -p 'Object.values(require(process.argv[1]).result)[0].expireTime' "$RUNNER_TEMP/channel.json")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "expires=$expires" >> "$GITHUB_OUTPUT"

      - name: Comment the preview URL
        if: steps.ready.outputs.ready == 'true'
        uses: actions/github-script@v9
        env:
          URL: ${{ steps.deploy.outputs.url }}
          EXPIRES: ${{ steps.deploy.outputs.expires }}
        with:
          script: |
            const marker = '<!-- materia-preview -->';
            const body = [
              marker,
              `**Preview:** ${process.env.URL}/health`,
              '',
              `Commit \`${process.env.SHA.slice(0, 7)}\`, expires ${process.env.EXPIRES}.`,
              'Previews call the dev project\'s functions from `main`; callable changes in this PR are not live here.',
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.user.type === 'Bot' && c.body.includes(marker));
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });

  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # Workload Identity Federation
      pull-requests: read
    env:
      PROJECT: ${{ vars.GCP_PROJECT_DEV }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Authenticate to Google Cloud (Workload Identity Federation, no key)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER_DEV }}
          service_account: ${{ vars.GCP_DEPLOYER_SA_DEV }}

      - name: Delete this PR's channel and any other closed PR's
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm exec node .github/scripts/prune-preview-channels.mjs
