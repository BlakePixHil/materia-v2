# clamd for the scan service (CORE-12a). Local socket only: the Node wrapper is the only client.
Foreground yes
LocalSocket /tmp/clamd.sock
LocalSocketMode 600
DatabaseDirectory /var/lib/clamav
TemporaryDirectory /tmp
LogTime yes
LogVerbose no
# Uploads are at most 50 MB (ADR-028); archives and Office files expand when scanned.
StreamMaxLength 60M
MaxFileSize 60M
MaxScanSize 400M
MaxThreads 4
# One copy of the signatures in memory: a reload pauses scans briefly instead of doubling memory.
ConcurrentDatabaseReload no
SelfCheck 3600
