# freshclam for the scan service (CORE-12a): hourly checks while the instance is up; clamd reloads
# the new signatures when told (NotifyClamd). The image ships with signatures at most a day old.
DatabaseDirectory /var/lib/clamav
DatabaseMirror database.clamav.net
Checks 24
NotifyClamd /etc/clamav/clamd.conf
LogTime yes
Foreground yes
