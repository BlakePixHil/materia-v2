<!doctype html>
<!-- A sample template for the PDF service's tests and the dev test callable (FND-24). Real
     templates (invoices, court books) arrive with BILL-07 and LIT-10. -->
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <title>{{title}}</title>
    {{> styles}}
  </head>
  <body>
    <h1>{{title}}</h1>
    <p>Dear {{recipient}},</p>
    {{#each paragraphs}}
    <p>{{this}}</p>
    {{/each}} {{#if items}}
    <table>
      <thead>
        <tr>
          <th scope="col">Item</th>
          <th scope="col">Detail</th>
        </tr>
      </thead>
      <tbody>
        {{#each items}}
        <tr>
          <td>{{label}}</td>
          <td>{{detail}}</td>
        </tr>
        {{/each}}
      </tbody>
    </table>
    {{/if}} {{#each extraPages}}
    <section class="page-break">
      <p>{{this}}</p>
    </section>
    {{/each}}
  </body>
</html>
