<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Materia</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="preload" href="/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Theme boot (FND-07): sets data-theme before the app loads, so there is no flash of the wrong
      // theme. Mirrors ThemeService (libs/ui). Its CSP hash is in apps/web/csp-hashes.json.
      (function () {
        var pref = null;
        try {
          pref = localStorage.getItem('mt-theme');
        } catch (e) {}
        var dark = pref === 'dark' || (pref !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      })();
    </script>
  </head>
  <body>
    <mt-root></mt-root>
  </body>
</html>
